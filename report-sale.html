<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report a Sale</title>
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box; margin:0; padding:0; font-family:-apple-system, sans-serif;}
  body{ background:#F6F7FB; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ max-width:420px; width:100%; background:#fff; border-radius:14px; padding:28px; box-shadow:0 12px 30px -12px rgba(0,0,0,0.15); }
  h1{ font-size:20px; margin-bottom:6px; }
  p.hint{ font-size:13px; color:#666; margin-bottom:20px; }
  label{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; margin-top:14px; }
  input, textarea{ width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:15px; }
  button{ width:100%; margin-top:20px; padding:13px; background:#3B5BFF; color:#fff; border:none; border-radius:8px; font-weight:700; font-size:15px; cursor:pointer; }
  button:disabled{ opacity:0.6; }
  #result{ margin-top:16px; font-size:13.5px; padding:10px; border-radius:8px; display:none; }
  #result.success{ background:#EAF7EE; color:#1a7a3a; display:block; }
  #result.error{ background:#FDECEC; color:#b02a2a; display:block; }
</style>
</head>
<body>
  <div class="card">
    <h1>Report a DM/Offline Sale</h1>
    <p class="hint">Only use this for sales that did NOT go through the real Paystack checkout link (e.g. paid you directly after a DM/call). If they paid through the actual link, it's already tracked, don't report it here too.</p>

    <label>Customer email</label>
    <input type="email" id="email" placeholder="optional if you have phone">

    <label>Customer phone</label>
    <input type="tel" id="phone" placeholder="e.g. 08012345678, optional if you have email">

    <label>Sale value (₦)</label>
    <input type="number" id="value" placeholder="15000" required>

    <label>Note (just for your own reference)</label>
    <textarea id="note" rows="2" placeholder="e.g. IG DM close, snapchat ads"></textarea>

    <button id="submitBtn">Report This Sale</button>
    <div id="result"></div>
  </div>

  <script>
    document.getElementById('submitBtn').addEventListener('click', async function(){
      var email = document.getElementById('email').value.trim();
      var phone = document.getElementById('phone').value.trim();
      var value = document.getElementById('value').value.trim();
      var note = document.getElementById('note').value.trim();
      var resultEl = document.getElementById('result');
      var btn = document.getElementById('submitBtn');

      resultEl.className = '';
      resultEl.style.display = 'none';

      if(!email && !phone){
        resultEl.className = 'error';
        resultEl.textContent = 'Enter at least an email or a phone number.';
        return;
      }
      if(!value){
        resultEl.className = 'error';
        resultEl.textContent = 'Enter the sale value.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';

      try{
        var res = await fetch('/api/report-offline-sale', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, phone: phone, value: value, note: note })
        });
        var data = await res.json();

        if(res.ok && data.success){
          resultEl.className = 'success';
          resultEl.textContent = 'Sale reported to Meta successfully.';
          document.getElementById('email').value = '';
          document.getElementById('phone').value = '';
          document.getElementById('value').value = '';
          document.getElementById('note').value = '';
        } else {
          resultEl.className = 'error';
          resultEl.textContent = 'Failed: ' + (data.error || 'unknown error');
        }
      } catch(e){
        resultEl.className = 'error';
        resultEl.textContent = 'Network error, try again.';
      }

      btn.disabled = false;
      btn.textContent = 'Report This Sale';
    });
  </script>
</body>
</html>
